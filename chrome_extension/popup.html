<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>条文スタディ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            width: 400px;
            min-height: 200px;
            max-height: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            font-size: 20px;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 500;
        }
        .search-container {
            padding: 12px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
        }
        .search-box {
            display: flex;
            gap: 8px;
        }
        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 2px rgba(57, 73, 171, 0.2);
        }
        .search-input::placeholder {
            color: #999;
        }
        .search-btn {
            padding: 10px 16px;
            background: #3949ab;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover {
            background: #303f9f;
        }
        .search-btn:disabled {
            background: #9fa8da;
            cursor: not-allowed;
        }
        .quick-links {
            padding: 8px 12px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
        }
        .quick-links-title {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
        }
        .quick-link-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .quick-link {
            padding: 4px 8px;
            background: #e8eaf6;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            color: #3949ab;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quick-link:hover {
            background: #c5cae9;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            max-height: 400px;
        }
        .welcome {
            text-align: center;
            padding: 30px 20px;
            color: #666;
        }
        .welcome-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .welcome h2 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        .welcome p {
            font-size: 12px;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #3949ab;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .article-title {
            font-size: 14px;
            font-weight: bold;
            color: #1a237e;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8eaf6;
        }
        .article-content {
            font-size: 13px;
            line-height: 1.7;
            color: #333;
        }
        .article-content p {
            margin: 8px 0;
        }
        .article-content .items {
            margin-left: 1em;
        }
        .article-content .item {
            margin: 4px 0;
        }
        .article-content .item-title {
            font-weight: bold;
        }
        .parentheses-content {
            background-color: #e0e0e0;
            padding: 0 2px;
            border-radius: 2px;
        }
        .internal-link {
            color: #1565c0;
            cursor: pointer;
            text-decoration: underline;
        }
        .internal-link:hover {
            color: #0d47a1;
        }
        .nav-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .nav-btn {
            padding: 4px 10px;
            background: #e8eaf6;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            color: #3949ab;
            cursor: pointer;
        }
        .nav-btn:hover {
            background: #c5cae9;
        }
        .nav-btn:disabled {
            background: #eee;
            color: #999;
            cursor: not-allowed;
        }
        .footer {
            padding: 8px 12px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            font-size: 10px;
            color: #666;
            text-align: center;
        }
        .footer a {
            color: #3949ab;
        }
        .open-tab-btn {
            margin-top: 10px;
            padding: 6px 12px;
            background: #fff;
            border: 1px solid #3949ab;
            border-radius: 4px;
            font-size: 12px;
            color: #3949ab;
            cursor: pointer;
            transition: all 0.2s;
        }
        .open-tab-btn:hover {
            background: #3949ab;
            color: white;
        }
        .settings-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-label {
            font-size: 12px;
            color: #666;
        }
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 22px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: #3949ab;
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-icon">📚</span>
        <h1>条文スタディ</h1>
    </div>
    
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" 
                   placeholder="例: 特許法29条、民法709条" autofocus>
            <button id="search-btn" class="search-btn">検索</button>
        </div>
    </div>
    
    <div class="settings-bar">
        <div class="toggle-container">
            <span class="toggle-label">📚 検索ボタン表示</span>
            <label class="toggle-switch">
                <input type="checkbox" id="floating-btn-toggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>
    
    <div class="quick-links">
        <div class="quick-links-title">よく使う法令</div>
        <div class="quick-link-btns">
            <button class="quick-link" data-law="特許法">特許法</button>
            <button class="quick-link" data-law="実用新案法">実用新案</button>
            <button class="quick-link" data-law="意匠法">意匠法</button>
            <button class="quick-link" data-law="商標法">商標法</button>
            <button class="quick-link" data-law="著作権法">著作権</button>
            <button class="quick-link" data-law="不正競争防止法">不競法</button>
            <button class="quick-link" data-law="憲法">憲法</button>
            <button class="quick-link" data-law="民法">民法</button>
            <button class="quick-link" data-law="商法">商法</button>
            <button class="quick-link" data-law="民事訴訟法">民訴法</button>
            <button class="quick-link" data-law="刑事訴訟法">刑訴法</button>
        </div>
    </div>
    
    <div class="content" id="content">
        <div class="welcome">
            <div class="welcome-icon">📖</div>
            <h2>条文を検索</h2>
            <p>上の検索ボックスに法令参照を入力してください。<br>
            例：「特許法29条」「民法第709条」</p>
        </div>
    </div>
    
    <div class="footer">
        出典：<a href="https://laws.e-gov.go.jp/" target="_blank">e-Gov法令検索</a>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
